<!DOCTYPE html>
<!--
  Source for assets/img/og-card.png (the 1200 x 630 image shown when a page is shared).
  Regenerate with tools/make-og-card.sh after changing this file or the icon.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(150deg, #123b45 0%, #0a1729 70%);
    color: #d4e8f0;
    display: flex;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }
  .text { flex: 1; padding: 0 40px 0 80px; }
  .brand { display: flex; align-items: center; gap: 20px; margin-bottom: 44px; }
  .brand img { width: 88px; height: 88px; border-radius: 22%; }
  .brand span { color: #fff; font-size: 44px; font-weight: 800; letter-spacing: -0.01em; }
  h1 { color: #fff; font-size: 54px; line-height: 1.12; margin: 0 0 24px; font-weight: 800; letter-spacing: -0.015em; }
  p { font-size: 28px; line-height: 1.35; margin: 0; color: #99edf2; font-weight: 600; }
  .shot { width: 330px; margin-right: 90px; margin-top: 150px; align-self: flex-start; }
  .shot img { width: 100%; border-radius: 40px; border: 1px solid rgba(255,255,255,0.16); box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><img src="../assets/img/icon-512.png" alt=""><span>MyCareRoster</span></div>
    <h1>Your family's doctors and details, in one private place.</h1>
    <p>For iPhone and iPad</p>
  </div>
  <div class="shot"><img src="../assets/img/iphone-roster-800.webp" alt=""></div>
</body>
</html>
